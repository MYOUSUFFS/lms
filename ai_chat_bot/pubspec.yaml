name: ai_chat_bot
description: "AI Chat Bot - LMS RAG Assistant"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # HTTP & Networking
  http: ^1.2.2
  http_parser: ^4.0.2
  
  # Utilities
  uuid: ^4.4.2
  intl: ^0.19.0
  
  # Local Storage
  shared_preferences: ^2.3.2
  
  # UI Components
  flutter_markdown: ^0.7.4
  google_fonts: ^6.2.1
  
  # File Picker
  file_picker: ^8.1.2
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
