# ===========================================
# LMS RAG Backend - Docker Compose
# Complete deployment stack
# ===========================================

version: "3.8"

services:
  # ===========================================
  # Main API Service
  # ===========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms-rag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - API_KEY=${API_KEY:-change-me-in-production}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - USE_CLOUD_FALLBACK=${USE_CLOUD_FALLBACK:-true}
      - CLOUD_PROVIDER=${CLOUD_PROVIDER:-groq}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma_db
      - UPLOAD_DIRECTORY=/app/data/uploads
    volumes:
      - chroma_data:/app/data/chroma_db
      - uploads_data:/app/data/uploads
      - model_cache:/root/.cache # Cache for embedding models
    depends_on:
      - ollama
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================
  # Ollama - Local LLM Server
  # ===========================================
  ollama:
    image: ollama/ollama:latest
    container_name: lms-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - lms-network
    # GPU support (uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ===========================================
  # Nginx Reverse Proxy
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: lms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - api
    networks:
      - lms-network

# ===========================================
# Volumes
# ===========================================
volumes:
  chroma_data:
    driver: local
  uploads_data:
    driver: local
  ollama_data:
    driver: local
  model_cache:
    driver: local
  nginx_cache:
    driver: local

# ===========================================
# Networks
# ===========================================
networks:
  lms-network:
    driver: bridge
